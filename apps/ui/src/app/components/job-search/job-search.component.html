<section class="search jf-card">
  <div class="search-row">
    <div class="input-box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" class="lens" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m16.5 16.5 4.5 4.5" />
      </svg>
      <input
        [value]="query"
        (input)="onInput($any($event.target).value)"
        placeholder="Например: python, дизайнер, удалёнка, $"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="search"
        aria-label="Поиск вакансий"
      />
      <button type="button" class="clear-btn" title="Очистить" *ngIf="query" (click)="clear()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </div>
    <div class="stats-box">
      <div class="stats-title">Найдено</div>
      <div class="stats-value jf-mono">{{ filtered }} / {{ total }}</div>
    </div>
  </div>

  <div class="filters-row">
    <div class="pills">
      <button
        type="button"
        class="pill preset"
        *ngFor="let p of presets"
        [class.on]="isPresetActive(p.value)"
        (click)="togglePreset(p.value)"
      >
        <svg *ngIf="isPresetActive(p.value)" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true">
          <path d="m5 13 4.5 4.5L19 7" />
        </svg>
        {{ p.label }}
      </button>
    </div>

    <span class="divider" *ngIf="presets.length && sources.length"></span>

    <div class="pills" *ngIf="sources.length">
      <button
        type="button"
        class="pill source"
        *ngFor="let s of sources"
        [class.on]="isSourceActive(s.value)"
        [title]="'Источник: ' + s.label"
        (click)="toggleSource(s.value)"
      >
        <span class="source-icon" [innerHTML]="getSourceIconSvg(s.icon)"></span>
        {{ s.label }}
      </button>
    </div>
  </div>
</section>
