<mat-card class="search-card">
  <div class="search-row">
    <mat-form-field class="search-field" appearance="outline">
      <mat-icon matPrefix class="material-symbols-outlined" aria-hidden="true">search</mat-icon>
      <input
        matInput
        [ngModel]="query"
        (ngModelChange)="onInput($event)"
        placeholder="Например: python, дизайнер, удалёнка, $"
        autocomplete="off"
        lang="en-US"
        inputmode="text"
        spellcheck="false"
        autocapitalize="none"
        autocorrect="off"
        enterkeyhint="search"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        aria-label="Очистить поиск"
        [disabled]="!query"
        (click)="clear()"
      >
        <mat-icon class="material-symbols-outlined" aria-hidden="true">close</mat-icon>
      </button>
    </mat-form-field>

    <div class="stats" aria-label="Статистика результатов">
      <div class="stats-title">Найдено</div>
      <div class="stats-value">{{ filtered }} / {{ total }}</div>
    </div>
  </div>

  <div class="filters-row" *ngIf="presets.length || sources.length">
    <mat-chip-listbox aria-label="Быстрые фильтры поиска" *ngIf="presets.length">
      <mat-chip-option
        *ngFor="let p of presets"
        (click)="applyPreset(p.value)"
      >
        {{ p.label }}
      </mat-chip-option>
    </mat-chip-listbox>

    <div class="divider" *ngIf="presets.length && sources.length"></div>

    <div aria-label="Источники поиска" *ngIf="sources.length">
      <div
        *ngFor="let s of sources"
        class="source-chip"
        (click)="applySource(s.value)"
      >
        <span class="source-icon">
          <span class="source-icon-svg" [innerHTML]="getSourceIconSvg(s.icon)"></span>
        </span>
      </div>
    </div>
  </div>
</mat-card>
