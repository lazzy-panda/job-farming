<section class="jf-card form-card">
  <div class="jf-section-label group-label">SMTP и API</div>
  <div class="fields-grid">
    <label class="jf-field" *ngFor="let field of smtpFields">
      <span>{{ field.label }}</span>
      <input
        class="jf-input jf-input--mono"
        [type]="field.type === 'number' ? 'number' : 'text'"
        [name]="field.key"
        [placeholder]="field.placeholder ?? ''"
        [(ngModel)]="settings[field.key]"
      />
    </label>
  </div>

  <div class="jf-section-label group-label divided">Telegram HTTP</div>
  <div class="fields-grid">
    <label class="jf-field" *ngFor="let field of telegramFields">
      <span>{{ field.label }}</span>
      <input
        class="jf-input jf-input--mono"
        [type]="field.type === 'number' ? 'number' : 'text'"
        [name]="field.key"
        [placeholder]="field.placeholder ?? ''"
        [(ngModel)]="settings[field.key]"
      />
    </label>
  </div>

  <div class="proxy-block">
    <div class="proxy-head">
      <button
        type="button"
        class="toggle"
        [class.on]="proxyEnabled"
        role="switch"
        [attr.aria-checked]="proxyEnabled"
        aria-label="Прокси для Telegram"
        (click)="toggleProxy()"
      >
        <span class="knob"></span>
      </button>
      <div>
        <div class="proxy-title">Прокси для Telegram</div>
        <div class="proxy-sub">Пул адресов обновляется скриптом <span class="jf-mono">npm run proxies:refresh</span></div>
      </div>
    </div>

    <div class="fields-grid proxy-fields" *ngIf="proxyEnabled">
      <label class="jf-field" *ngFor="let field of proxyFields">
        <span>{{ field.label }}</span>
        <input
          class="jf-input jf-input--mono"
          [type]="field.type === 'number' ? 'number' : 'text'"
          [name]="field.key"
          [placeholder]="field.placeholder ?? ''"
          [(ngModel)]="settings[field.key]"
        />
      </label>
    </div>
  </div>

  <div class="save-row">
    <button type="button" class="save-btn" (click)="save.emit(settings)">Сохранить настройки</button>
    <span class="save-hint">Изменения применяются без перезапуска API</span>
  </div>
</section>
