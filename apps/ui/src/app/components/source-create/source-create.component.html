<div class="create-row">
  <div class="input-col">
    <div class="input-box">
      <span class="type-icon" aria-hidden="true">
        <svg *ngIf="isTelegramSource()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2aa4dd" stroke-width="1.8" stroke-linejoin="round">
          <path d="m21.5 4.5-4 15.5-6-4.5-3 3v-4.5l9.5-8.5-11.5 7-4-1.5z" />
        </svg>
        <svg *ngIf="!isTelegramSource() && isFacebookSource()" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#1877f2" />
          <path d="M15.6 12.5h-2.4V19h-2.7v-6.5H8.9v-2.4h1.6V8.6c0-1.9 1.1-3.1 3.2-3.1.7 0 1.4.05 1.7.08v2.2h-1.2c-.9 0-1.1.4-1.1 1v1.4h2.6l-.4 2.4z" fill="#fff" />
        </svg>
        <svg *ngIf="!isTelegramSource() && !isFacebookSource() && isRssSource()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f07800" stroke-width="1.9" stroke-linecap="round">
          <path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16" />
          <circle cx="5" cy="19" r="1.6" fill="#f07800" stroke="none" />
        </svg>
        <svg *ngIf="!isTelegramSource() && !isFacebookSource() && !isRssSource()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
        </svg>
      </span>
      <input
        class="jf-mono"
        [ngModel]="model.url"
        (ngModelChange)="onUrlChange($event)"
        (keyup.enter)="submitSource()"
        placeholder="t.me/job_SA_PM или https://career.habr.com/vacancies/rss?q=…"
        aria-label="Адрес источника"
      />
    </div>
    <div class="hint" *ngIf="!urlError">
      Тип определён автоматически:
      <b>{{ isTelegramSource() ? 'Telegram-канал' : isFacebookSource() ? 'Facebook-группа (нужны cookies)' : isRssSource() ? 'RSS-лента' : '—' }}</b>
    </div>
    <div class="error" *ngIf="urlError">{{ urlError }}</div>
  </div>

  <button
    type="button"
    class="add-btn"
    (click)="submitSource()"
    [disabled]="!!urlError || !model.url || !model.url.trim()"
  >
    Добавить
  </button>
</div>
