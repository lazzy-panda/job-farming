<header class="header">
  <div class="header-container">
    <a routerLink="/" class="header-brand">
      <div>
        <img
          ngSrc="/logo-1.png"
          width="80"
          height="80"
          alt="Job Farm"
          class="brand-logo"
          priority
        />
      </div>
    </a>

    <nav class="header-nav">
      <a routerLink="/sources/new" routerLinkActive="active" class="nav-item">
        <mat-icon class="material-symbols-outlined nav-icon" aria-hidden="true">add_circle</mat-icon>
        <span class="nav-label">Добавить источник</span>
      </a>
      <a routerLink="/templates" routerLinkActive="active" class="nav-item">
        <mat-icon class="material-symbols-outlined nav-icon" aria-hidden="true">collections_bookmark</mat-icon>
        <span class="nav-label">Шаблоны</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-item">
        <mat-icon class="material-symbols-outlined nav-icon" aria-hidden="true">settings</mat-icon>
        <span class="nav-label">Настройки</span>
      </a>
    </nav>

    <div class="header-actions">
      <ng-container *ngIf="showSort">
        <app-sort-menu
          [sortMode]="sortMode"
          (sortChange)="sortChange.emit($event)"
        ></app-sort-menu>
      </ng-container>

      <button mat-icon-button (click)="refresh.emit()" class="action-btn" matTooltip="Обновить">
        <mat-icon class="material-symbols-outlined" aria-hidden="true">refresh</mat-icon>
      </button>
    </div>
  </div>
</header>
