<mat-card>
  <mat-card-title>{{ title }}</mat-card-title>
  <mat-card-content>
    <p>{{ text }}</p>
    <div class="meta" *ngIf="lastScrapedAt || lastMessageId || emptyRuns !== undefined">
      <div *ngIf="lastScrapedAt">Последний опрос: {{ lastScrapedAt }}</div>
      <div *ngIf="lastMessageId">Последний messageId: {{ lastMessageId }}</div>
      <div *ngIf="emptyRuns !== undefined">Пустых прогонов подряд: {{ emptyRuns }}</div>
      <div *ngIf="stopUntil">Пауза до: {{ stopUntil }}</div>
      <div *ngIf="lastError">Ошибка: {{ lastError }}</div>
    </div>
  </mat-card-content>
</mat-card>
