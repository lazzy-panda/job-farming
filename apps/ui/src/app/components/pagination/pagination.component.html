<div class="pager">
  <span class="pager-label jf-mono">
    <ng-container *ngIf="total > 0">Показано {{ startItem }}–{{ endItem }} из {{ total }}</ng-container>
    <ng-container *ngIf="total === 0">Нет данных</ng-container>
  </span>

  <div class="controls">
    <button
      type="button"
      class="nav-btn"
      title="Назад"
      (click)="previous()"
      [disabled]="pageIndex === 0 || total === 0"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="m14 6-6 6 6 6" />
      </svg>
    </button>

    <ng-container *ngFor="let page of displayedPages; trackBy: trackPage">
      <span class="gap jf-mono" *ngIf="page === 'ellipsis'">…</span>
      <button
        type="button"
        class="page-btn jf-mono"
        *ngIf="page !== 'ellipsis'"
        [class.active]="page === pageIndex + 1"
        (click)="selectPage(page)"
      >
        {{ page }}
      </button>
    </ng-container>

    <button
      type="button"
      class="nav-btn"
      title="Вперёд"
      (click)="next()"
      [disabled]="pageIndex >= totalPages - 1 || total === 0"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="m10 6 6 6-6 6" />
      </svg>
    </button>

    <select
      class="size-select"
      *ngIf="pageSizeOptions.length > 1"
      [value]="pageSize"
      (change)="changePageSize(+$any($event.target).value)"
      aria-label="Размер страницы"
    >
      <option *ngFor="let option of pageSizeOptions" [value]="option">{{ option }} на странице</option>
    </select>
  </div>
</div>
